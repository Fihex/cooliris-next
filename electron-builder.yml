appId: com.coolirisnext.app
productName: Cooliris Next
directories:
  output: release
  buildResources: build
# Vite emits the renderer to dist/ and the main/preload to dist-electron/. The ffmpeg
# layer needs its binaries shipped (and unpacked from the asar so they can be spawned).
files:
  - dist/**
  - dist-electron/**
  - "node_modules/ffmpeg-static/**"
  - "node_modules/ffprobe-static/**"
asarUnpack:
  - "node_modules/ffmpeg-static/**"
  - "node_modules/ffprobe-static/**"
linux:
  target: AppImage
  category: Graphics
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.graphics-design
